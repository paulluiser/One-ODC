project_id = "one-odc-development"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
[db]
port = 54322
major_version = 17
[auth]
enabled = true
site_url = "http://127.0.0.1:3001"
additional_redirect_urls = ["http://127.0.0.1:3001/auth/confirm"]
enable_signup = false
[auth.email]
enable_signup = false
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "50MiB"
[storage.buckets.one-odc-attachments]
public = false
file_size_limit = "50MiB"
